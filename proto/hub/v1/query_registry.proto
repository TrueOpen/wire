syntax = "proto3";
package hub.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "hub/v1/beacon.proto";
import "hub/v1/builder.proto";
import "hub/v1/candidate_pool.proto";
import "hub/v1/common.proto";
import "hub/v1/daily_support.proto";
import "hub/v1/fault.proto";
import "hub/v1/model_profile_state.proto";
import "hub/v1/params.proto";
import "hub/v1/participant_identity.proto";
import "hub/v1/reward.proto";
import "hub/v1/service_bond.proto";
import "shared/v1/common.proto";
import "shared/v1/query_page.proto";
import "shared/v1/rest_encoding.proto";

option go_package = "github.com/TrueOpen/node/x/hub/types";
// QueryHubParamsRequest has no selector.
message QueryHubParamsRequest {}

// QueryHubParamsResponse is response type for the Query/Params RPC method.
message QueryHubParamsResponse {
  // params holds all the parameters of this module.
  HubParamsV2 params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // meta carries this module's own params version/hash/updated height. Params
  // ownership stays per module: a client that needs a joint view calls
  // hub.v1.Query/Params and task.v1.Query/Params at the same
  // x-cosmos-block-height. Wire adds no app-level package importing both.
  HubParamsMetaState meta = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryBeaconRequest is request type for Query/Beacon.
message QueryBeaconRequest {
  uint64 height = 1;
}

// QueryBeaconResponse is response type for Query/Beacon.
message QueryBeaconResponse {
  BeaconState beacon = 1 [(gogoproto.nullable) = false];
}

// QueryBuilderSetRequest is request type for Query/BuilderSet.
message QueryBuilderSetRequest {
  // Exactly one retained BuilderSet locator must be supplied.
  // selector selects one supported variant.
  oneof selector {
    uint64 height = 1;
    string builder_set_id = 2;
  }
}

// QueryBuilderSetResponse is response type for Query/BuilderSet.
message QueryBuilderSetResponse {
  BuilderSetViewV1 set = 1 [(gogoproto.nullable) = false];
}

// BuilderSetViewV1 projects the public BuilderSet header and bounded body.
message BuilderSetViewV1 {
  uint64 builder_set_version = 1;
  string builder_set_id = 2;
  bytes builder_set_hash = 3 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 effective_height = 4;
  repeated string active_builders = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 active_builder_count = 6;
  shared.v1.StoredBodyStatus body_status = 7;
  optional uint64 pruned_height = 8;
}

// QueryBuilderRequest selects one Builder identity.
message QueryBuilderRequest {
  string builder_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryBuilderResponse returns the Builder primary row.
message QueryBuilderResponse {
  BuilderState builder = 1 [(gogoproto.nullable) = false];
}

// QueryBuildersRequest pages the builder registry. It carries no selector: the
// walk is the whole primary map, so the page token's selector digest binds only
// the chain id and the RPC name.
// QueryBuildersRequest defines the QueryBuildersRequest wire type.
message QueryBuildersRequest {
  shared.v1.QueryPageRequestV1 page = 1 [(gogoproto.nullable) = false];
}

// QueryBuildersResponse walks the builder primary map in canonical store key
// byte order. That is the Bech32 string key order, which is not guaranteed to
// match raw address byte order; the contract fixes the key order so no handler
// has to collect the whole table to re-sort it.
// QueryBuildersResponse defines the QueryBuildersResponse wire type.
message QueryBuildersResponse {
  repeated BuilderState builders = 1 [(gogoproto.nullable) = false];
  shared.v1.QueryPageResponseV1 page = 2 [(gogoproto.nullable) = false];
}

// QueryFaultRequest selects one immutable role fault by Hash32.
message QueryFaultRequest {
  bytes fault_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
}

// QueryFaultResponse returns the authoritative role fault row.
message QueryFaultResponse {
  RoleFaultState fault = 1 [(gogoproto.nullable) = false];
  SlashSummaryState slash_summary = 2;
}

// QueryTaskRequest is request type for Query/Task.
// QueryEarningsRequest defines the QueryEarningsRequest wire type.
message QueryEarningsRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryEarningsResponse is response type for Query/Earnings.
message QueryEarningsResponse {
  EarningsState earnings = 1 [(gogoproto.nullable) = false];
}
// QueryModelRequest is request type for Query/Model.
message QueryModelRequest {
  bytes model_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
}

// QueryModelResponse is response type for Query/Model.
message QueryModelResponse {
  ModelState model = 1 [(gogoproto.nullable) = false];
}

// QueryModelsRequest pages the model registry. It carries no selector: the walk
// is the whole primary map, so the page token's selector digest binds only the
// chain id and the RPC name.
// QueryModelsRequest defines the QueryModelsRequest wire type.
message QueryModelsRequest {
  shared.v1.QueryPageRequestV1 page = 1 [(gogoproto.nullable) = false];
}

// QueryModelsResponse walks the model primary map in canonical store key byte
// order. An empty registry is an empty list, not NotFound.
// QueryModelsResponse defines the QueryModelsResponse wire type.
message QueryModelsResponse {
  repeated ModelState models = 1 [(gogoproto.nullable) = false];
  shared.v1.QueryPageResponseV1 page = 2 [(gogoproto.nullable) = false];
}

// QueryProfileRequest is request type for Query/Profile.
message QueryProfileRequest {
  bytes model_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint32 profile_version = 2;
}

// QueryProfileResponse is response type for Query/Profile.
message QueryProfileResponse {
  ProfileState profile = 1 [(gogoproto.nullable) = false];
}

// QueryCortexNodeRequest selects one stable Cortex identity.
message QueryCortexNodeRequest {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryCortexNodeResponse returns the Cortex primary row.
message QueryCortexNodeResponse {
  CortexNodeState node = 1 [(gogoproto.nullable) = false];
}

// QueryServiceBondRequest selects one operator service bond.
message QueryServiceBondRequest {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryServiceBondResponse returns the bond with recomputed invariants.
message QueryServiceBondResponse {
  ServiceBondState bond = 1 [(gogoproto.nullable) = false];
}

// QueryServiceUnbondingsRequest pages one operator status slice.
message QueryServiceUnbondingsRequest {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  UnbondingStatus status = 2;
  shared.v1.QueryPageRequestV1 page = 3 [(gogoproto.nullable) = false];
}

// QueryServiceUnbondingsResponse walks the operator/status index.
message QueryServiceUnbondingsResponse {
  repeated UnbondingState entries = 1 [(gogoproto.nullable) = false];
  shared.v1.QueryPageResponseV1 page = 2 [(gogoproto.nullable) = false];
}

// QueryCurrentServiceKeyRequest identifies the sole current binding for an operator.
message QueryCurrentServiceKeyRequest {
  shared.v1.ParticipantType participant_type = 1;
  string operator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryCurrentServiceKeyResponse returns the authoritative binding lifecycle.
message QueryCurrentServiceKeyResponse {
  CurrentServiceKeyViewV1 binding = 1 [(gogoproto.nullable) = false];
}

// QueryServiceDescriptorRequest selects one current descriptor.
message QueryServiceDescriptorRequest {
  shared.v1.ParticipantType participant_type = 1;
  string operator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryServiceDescriptorResponse returns the bounded descriptor row.
message QueryServiceDescriptorResponse {
  ServiceDescriptorState descriptor = 1 [(gogoproto.nullable) = false];
}
// QueryModelCapabilityRequest selects one operator/model capability.
message QueryModelCapabilityRequest {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes model_id = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
}

// QueryModelCapabilityResponse returns the capability row.
message QueryModelCapabilityResponse {
  ModelCapabilityState capability = 1 [(gogoproto.nullable) = false];
}

// QueryModelSupportRequest identifies one operator/model support row.
message QueryModelSupportRequest {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes model_id = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
}

// QueryModelSupportResponse returns one node-level P30 support row.
message QueryModelSupportResponse {
  ModelSupportState support = 1 [(gogoproto.nullable) = false];
}

// QueryDailySupportRequest selects one operator/epoch heartbeat.
message QueryDailySupportRequest {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch = 2;
}

// QueryDailySupportResponse returns the retained heartbeat row.
message QueryDailySupportResponse {
  DailySupportState support = 1 [(gogoproto.nullable) = false];
}

// QueryServiceLifecycleRequest selects one operator lifecycle view.
message QueryServiceLifecycleRequest {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryServiceLifecycleResponse combines identity and bond only.
message QueryServiceLifecycleResponse {
  ServiceLifecycleViewV1 lifecycle = 1 [(gogoproto.nullable) = false];
}

// QueryCurrentCandidatePoolRequest has no selector (the wire API): the single
// global pool is resolved from the current pointer. The old per-profile
// model_id/profile_version/duty selectors are deleted because per-profile pools no
// longer exist.
// QueryCurrentCandidatePoolRequest defines the QueryCurrentCandidatePoolRequest wire type.
message QueryCurrentCandidatePoolRequest {}

// QueryCurrentCandidatePoolResponse returns the one ACTIVE snapshot the current
// pointer resolves to; a missing pointer is NotFound and the Query never triggers
// a build.
// QueryCurrentCandidatePoolResponse defines the QueryCurrentCandidatePoolResponse wire type.
message QueryCurrentCandidatePoolResponse {
  CandidatePoolSnapshotViewV1 snapshot = 1 [(gogoproto.nullable) = false];
}

// QueryCandidatePoolSnapshotRequest identifies one immutable pool snapshot
//.
// QueryCandidatePoolSnapshotRequest defines the QueryCandidatePoolSnapshotRequest wire type.
message QueryCandidatePoolSnapshotRequest {
  bytes snapshot_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
}

// QueryCandidatePoolSnapshotResponse projects the public header and hides build
// and refcount fields. status = PRUNED does not mean an empty pool; member
// queries must then return FailedPrecondition.
// QueryCandidatePoolSnapshotResponse defines the QueryCandidatePoolSnapshotResponse wire type.
message QueryCandidatePoolSnapshotResponse {
  CandidatePoolSnapshotViewV1 snapshot = 1 [(gogoproto.nullable) = false];
}

// QueryCandidatePoolMemberRequest selects one stable slot of one snapshot
//.
// QueryCandidatePoolMemberRequest defines the QueryCandidatePoolMemberRequest wire type.
message QueryCandidatePoolMemberRequest {
  bytes snapshot_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint32 candidate_slot = 2;
}

// QueryCandidatePoolMemberResponse returns the verifiable member/binding join.
// A pruned body is FailedPrecondition; only an unknown snapshot or member is
// NotFound.
//
// The response carries one CandidatePoolMemberViewV1. Its membership binding
// is represented by the view's frozen fields, not by a duplicate message.
// QueryCandidatePoolMemberResponse defines the QueryCandidatePoolMemberResponse wire type.
message QueryCandidatePoolMemberResponse {
  CandidatePoolMemberViewV1 member = 1 [(gogoproto.nullable) = false];
}

// QueryCandidatePoolMembersRequest pages one snapshot's members.
message QueryCandidatePoolMembersRequest {
  bytes snapshot_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  shared.v1.QueryPageRequestV1 page = 2 [(gogoproto.nullable) = false];
}

// QueryCandidatePoolMembersResponse walks slots in ascending order under the
// count and bytes caps; a pruned snapshot body is FailedPrecondition for the whole
// call.
// QueryCandidatePoolMembersResponse defines the QueryCandidatePoolMembersResponse wire type.
message QueryCandidatePoolMembersResponse {
  repeated CandidatePoolMemberViewV1 members = 1 [(gogoproto.nullable) = false];
  shared.v1.QueryPageResponseV1 page = 2 [(gogoproto.nullable) = false];
}

// CurrentServiceKeyViewV1 is the current key binding projection of this contract.
message CurrentServiceKeyViewV1 {
  shared.v1.ParticipantType participant_type = 1;
  string operator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string service_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // 33-byte compressed secp256k1 service key, not a digest; REST uses Base64.
  bytes service_pubkey = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
  uint64 service_authorization_nonce = 5;
  // Exactly one status matching participant_type is set.
  // participant_status selects one supported variant.
  oneof participant_status {
    ServiceKeyStatus cortex_service_key_status = 6;
    ServiceKeyStatus builder_service_key_status = 7;
  }
  uint64 current_descriptor_version = 8;
}

// ServiceLifecycleViewV1 joins the identity and bond authorities.
message ServiceLifecycleViewV1 {
  optional CortexNodeState node = 1;
  ServiceBondState bond = 2 [(gogoproto.nullable) = false];
}
