syntax = "proto3";

package hub.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "shared/v1/amount.proto";
import "shared/v1/common.proto";
import "shared/v1/rest_encoding.proto";

option go_package = "github.com/TrueOpen/node/x/hub/types";

// BuilderCompensationAccountState defines the canonical BuilderCompensationAccountState fields.
message BuilderCompensationAccountState {
  string builder_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  shared.v1.Amount balance = 2 [(gogoproto.nullable) = false];
  shared.v1.Amount total_funded = 3 [(gogoproto.nullable) = false];
  shared.v1.Amount total_paid = 4 [(gogoproto.nullable) = false];
  shared.v1.Amount total_penalized = 5 [(gogoproto.nullable) = false];
}
// MsgFundBuilderCompensation defines the canonical MsgFundBuilderCompensation fields.
message MsgFundBuilderCompensation {
  option (cosmos.msg.v1.signer) = "signer_address";
  option (amino.name) = "trueopen/x/hub/MsgFundBuilderCompensation";
  string builder_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  shared.v1.Amount amount = 2 [(gogoproto.nullable) = false];
  string signer_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
// MsgFundBuilderCompensationResponse defines the canonical MsgFundBuilderCompensationResponse fields.
message MsgFundBuilderCompensationResponse {
  shared.v1.Amount balance = 1 [(gogoproto.nullable) = false];
  shared.v1.MutationStatusV1 status = 2;
}
// CandidateProfileWeightInputV1 defines the canonical CandidateProfileWeightInputV1 fields.
message CandidateProfileWeightInputV1 {
  bytes model_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint32 profile_version = 2;
  bool profile_support_fresh = 3;
  shared.v1.Amount min_stake_snapshot = 4 [(gogoproto.nullable) = false];
  bool inference_capable = 5;
}
// CandidateWeightInputsV1 defines the canonical CandidateWeightInputsV1 fields.
message CandidateWeightInputsV1 {
  shared.v1.Amount active_bond = 1 [(gogoproto.nullable) = false];
  shared.v1.Amount available_bond = 2 [(gogoproto.nullable) = false];
  uint32 performance_score_ppm = 3;
  uint32 performance_method_version = 4;
  uint32 candidate_jail_factor_ppm = 5;
  bool inference_capable = 6;
  bool unbonding = 7;
  bool tombstoned = 8;
  repeated CandidateProfileWeightInputV1 profiles = 9;
}
// CandidatePoolSnapshotMemberViewV1 defines the canonical CandidatePoolSnapshotMemberViewV1 fields.
message CandidatePoolSnapshotMemberViewV1 {
  bool in_pool = 1;
  uint32 slot = 2;
  uint64 slot_version = 3;
  bytes binding_hash = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  optional CandidateWeightInputsV1 weight_inputs = 5;
  optional bool profile_support_fresh = 6;
  optional shared.v1.Amount min_stake_snapshot = 7;
  optional uint64 candidate_weight = 8;
}
// QueryCandidatePoolSnapshotMemberRequest defines the canonical QueryCandidatePoolSnapshotMemberRequest fields.
message QueryCandidatePoolSnapshotMemberRequest {
  bytes snapshot_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  string operator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  optional bytes model_id = 3 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  optional uint32 profile_version = 4;
}
// QueryCandidatePoolSnapshotMemberResponse defines the canonical QueryCandidatePoolSnapshotMemberResponse fields.
message QueryCandidatePoolSnapshotMemberResponse {
  CandidatePoolSnapshotMemberViewV1 member = 1;
}
// QueryBuilderCompensationAccountRequest defines the canonical QueryBuilderCompensationAccountRequest fields.
message QueryBuilderCompensationAccountRequest {
  string builder_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
// QueryBuilderCompensationAccountResponse defines the canonical QueryBuilderCompensationAccountResponse fields.
message QueryBuilderCompensationAccountResponse {
  BuilderCompensationAccountState account = 1;
}

// EventBuilderCompensationFunded defines the canonical EventBuilderCompensationFunded fields.
message EventBuilderCompensationFunded {
  string builder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  shared.v1.Amount amount = 2 [(gogoproto.nullable) = false];
  shared.v1.Amount balance = 3 [(gogoproto.nullable) = false];
}

// DispatchFaultState defines the canonical DispatchFaultState fields.
message DispatchFaultState {
  string builder_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes fault_id = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  shared.v1.DispatchChallengeKindV1 kind = 3;
  bytes task_id = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes dispatch_record_hash = 5 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes challenged_ticket_hash_or_zero32 = 6 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  shared.v1.Amount penalty_amount = 7 [(gogoproto.nullable) = false];
  shared.v1.Amount unfilled_amount = 8 [(gogoproto.nullable) = false];
  optional string compensated_worker = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  shared.v1.Amount compensated_amount = 10 [(gogoproto.nullable) = false];
  uint64 fault_height = 11;
}

// EventBuilderVrfKeyRegistered defines the canonical EventBuilderVrfKeyRegistered fields.
message EventBuilderVrfKeyRegistered {
  string builder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 pending_from_epoch = 2;
  uint64 vrf_authorization_nonce = 3;
}
