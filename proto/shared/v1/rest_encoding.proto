syntax = "proto3";
package shared.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/TrueOpen/node/x/shared/types";

// the API contract fixes this file path, this package,
// the enum names and numbers and the extension number 51001. They are frozen:
// client-facing bytes semantics must be decided by the wire descriptor, never
// by a field-name table, a runtime length sniff or a generator built-in
// allowlist. SDK/API documentation and REST path/JSON projection consume the
// same metadata.
//
// The option may only annotate a protobuf `bytes` leaf. Annotating any other
// type, using an unknown enum value, or leaving missing/UNSPECIFIED on a bytes
// leaf reachable from a public service must fail the wire schema/release lint.
// The public closure is the recursive request/response descriptor closure of
// every registered RPC in exactly these six services:
//   - hub.v1.Msg
//   - hub.v1.Query
//   - task.v1.Msg
//   - task.v1.Query
//   - hub.v1.HubEventService
//   - task.v1.TaskEventService
// A new RPC or newly reachable message must complete its whole bytes closure in
// the same change. Only internal State/Genesis and unregistered messages outside
// that closure may remain unannotated.
//
// Conversion carries the root message descriptor and walks actual field
// descriptors: nested, repeated and oneof branches each read their own leaf
// option, repeated applies the same rule per element, and a field name never
// inherits an option from an identically named field in another message
// (§1.1a).
//
// Raw protobuf binary, native gRPC, the Store and every hash/signature preimage
// always use raw bytes and are unaffected by this option. In particular, adding
// metadata to the two gRPC-only event services does not change their transport.
//
// Error handling (§1.1a): a non-canonical or wrong-width Hash32 in
// a request returns InvalidArgument. A non-canonical width appearing in a
// response or in state means the invariant is already broken, so the server must
// fail closed with an internal error; it must never silently fall back to
// Base64 for that value.
//
// V1 public service closure forbids a bytes map value; map-value option semantics
// must be defined first. A Hash32 REST path variable may only come from a
// HASH32_LOWER_HEX field, and Base64 bytes never enter a path
// (§1.1a).
//
// presence rules (§1.1a):
//   - only proto `optional bytes` can express absence;
//   - an absent field is omitted from JSON output and must also be omitted from
//     canonical JSON input, and an explicit `null` is rejected;
//   - once an optional field is present, empty bytes and a wrong width are both
//     rejected;
//   - a non-optional Hash32 must always be raw32 in a successful
//     request/response; business logic that allows absence must declare the
//     field optional instead of writing a zero-length bytes value;
//   - repeated Hash32 may be an empty collection, but every present element must
//     be raw32 and a zero-length element is rejected;
//   - an unselected oneof produces no output just like an absent optional, and a
//     selected bytes branch is validated by that branch's own option.
//
// OpenAPI projection (§1.1a), read from this same option by the
// generator and by the runtime gateway, with no field-name override:
//   HASH32_LOWER_HEX -> {type: string, format: trueopen-hash32,
//                        pattern: ^[0-9a-f]{64}$, minLength: 64, maxLength: 64}
//   PROTOJSON_BASE64 -> {type: string, format: byte}
// Request descriptions state the four accepted alphabet/padding combinations;
// responses emit only the canonical padded form. Optional fields express absence
// by omission and the schema does not allow `null`; repeated uses the same item
// schema.

// RESTBytesEncoding is the closed client projection registry for protobuf bytes
// leaves. The historical name is retained because the enum and extension are
// already frozen. There is no legacy "exactly 32 bytes means hex, otherwise
// Base64" category: every public service bytes leaf carries an explicit
// non-zero value.
// RESTBytesEncoding defines the RESTBytesEncoding wire type.
enum RESTBytesEncoding {
  // Never valid on a public-service-reachable bytes leaf; the lint fails on it.
  // REST_BYTES_ENCODING_UNSPECIFIED identifies the corresponding protocol value.
  REST_BYTES_ENCODING_UNSPECIFIED = 0;
  // Ordinary variable-length bytes. Output is canonical RFC 4648
  // standard-alphabet Base64 with `=` padding. Input follows ProtoJSON and
  // accepts standard/URL-safe alphabets in padded and unpadded form (four
  // combinations), rejecting whitespace and malformed encodings. Typed
  // validation stays plain protobuf bytes and adds no length semantics.
  // REST_BYTES_ENCODING_PROTOJSON_BASE64 identifies the corresponding protocol value.
  REST_BYTES_ENCODING_PROTOJSON_BASE64 = 1;
  // A raw 32-byte digest/ID. Output is exactly 64 lowercase hex characters with
  // no `0x` prefix. Input accepts only that same form and is decoded to raw32
  // before typed validation; a present value must be exactly 32 raw bytes.
  // REST_BYTES_ENCODING_HASH32_LOWER_HEX identifies the corresponding protocol value.
  REST_BYTES_ENCODING_HASH32_LOWER_HEX = 2;
}

extend google.protobuf.FieldOptions {
  // rest_bytes_encoding declares the REST/JSON projection of one bytes leaf.
  // Extension number 51001 is frozen by §1.1a.
  RESTBytesEncoding rest_bytes_encoding = 51001;
}
