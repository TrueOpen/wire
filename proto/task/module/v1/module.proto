syntax = "proto3";
package task.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/TrueOpen/node/x/task/types";

// Module is the config object for the task module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/TrueOpen/node/x/task/module"};

  // authority defines the custom module authority.
  // If not set, defaults to the governance module.
  string authority = 1;
}
