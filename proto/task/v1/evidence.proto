syntax = "proto3";
package task.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "shared/v1/evidence.proto";
import "shared/v1/rest_encoding.proto";

option go_package = "github.com/TrueOpen/node/x/task/types";

// FinishReasonV1 is the closed successful termination set committed by the
// selected Worker. Error and cancellation outcomes cannot produce an accepted
// InferReceipt.
// FinishReasonV1 defines the FinishReasonV1 wire type.
enum FinishReasonV1 {
  // Never committed; an unset or unsuccessful finish is not receiptable.
  // FINISH_REASON_V1_UNSPECIFIED identifies the corresponding protocol value.
  FINISH_REASON_V1_UNSPECIFIED = 0;
  // Generation emitted the model/tokenizer EOS token.
  // FINISH_REASON_V1_EOS_TOKEN identifies the corresponding protocol value.
  FINISH_REASON_V1_EOS_TOKEN = 1;
  // Generation matched one frozen stop sequence.
  // FINISH_REASON_V1_STOP_SEQUENCE identifies the corresponding protocol value.
  FINISH_REASON_V1_STOP_SEQUENCE = 2;
  // Generation reached the accepted maximum output token count.
  // FINISH_REASON_V1_MAX_OUTPUT_TOKENS identifies the corresponding protocol value.
  FINISH_REASON_V1_MAX_OUTPUT_TOKENS = 3;
  // Generation reached the accepted maximum output duration.
  // FINISH_REASON_V1_MAX_OUTPUT_DURATION identifies the corresponding protocol value.
  FINISH_REASON_V1_MAX_OUTPUT_DURATION = 4;
  // The user stopped the generation and the Worker closed the stream on their
  // behalf. A stop is a successful termination, not an abandonment: the Worker
  // signs a Fin carrying this value and then signs the receipt, so a stopped
  // task is indistinguishable in shape from any other completed one. "No Fin"
  // stays reserved for a Worker that failed or gave up, which produces no
  // receipt either.
  //
  // Unlike every other value, this one cannot be checked: the stop signal
  // arrives off chain, so it is accepted as a Worker assertion.
  // FINISH_REASON_V1_USER_STOP identifies the corresponding protocol value.
  FINISH_REASON_V1_USER_STOP = 5;
  // Generation emitted one of the order's stop_token_ids. Distinct from
  // STOP_SEQUENCE because an order may carry both stop strings and stop tokens,
  // and which one ended the generation is a different fact. Checkable: the last
  // token of T belongs to the order's stop_token_ids.
  // FINISH_REASON_V1_STOP_TOKEN identifies the corresponding protocol value.
  FINISH_REASON_V1_STOP_TOKEN = 6;
}

// EvidenceCommitmentV1 is one worker-authored evidence commitment carried by
// InferReceiptV3. The list is sorted by evidence_kind
// ascending with unique kinds and must exactly equal the kind set required by
// the locked profile.
//
// The list's commitment - evidence_commitments_hash, domain
// TRUEOPEN_INFER_EVIDENCE_COMMITMENTS_V1 (§1.4) - has exactly one ordered preimage in
// this repository, defined in task/v1/infer_receipt.proto next to the
// TRUEOPEN_INFER_RECEIPT_V3 formula that consumes it. It covers the per-element frame
// layout of the three fields below, the leading uint32_be(count) and the empty-list
// case. §1.4 rule 1 forbids a second copy, so this file only points at it.
// EvidenceCommitmentV1 defines the EvidenceCommitmentV1 wire type.
message EvidenceCommitmentV1 {
  shared.v1.EvidenceKind evidence_kind = 1;
  bytes evidence_hash_or_root = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 encoded_size_bytes = 3;
}

// WorkerTokenCommitmentV1 is the A-level Worker commitment, behind the
// WORKER_TOKEN_OPENING evidence item (ADR-0023 decision one).
//
// ADR-0023 splits what WorkerValueCommitmentV2 folded into one item. The split
// is what lets a Verifier be given the token sequence it must reproduce without
// also being given the Worker's per-token values it is supposed to arrive at
// independently: A level is the prompt and the tokens, B level is the values.
// A Verifier reads A immediately and B only after committing to its own values.
//
// A level is a flat hash consumed whole. There is nothing to open at a single
// position here -- the token id lists are the inputs to the work, not a claim
// about it -- so it needs no Merkle tree.
//
// finish_reason lives here rather than in B, because it is a fact about the
// generation that terminated, and a Verifier needs it while reproducing the
// token sequence. It is the same value the Worker's signed Fin carries
// (ADR-0027); the two come from one persisted state and are never read twice
// from the engine.
//
// trace_root and checkpoint_root are gone, along with their size fields.
// ADR-0023 retires both artifacts; they appear in no commitment.
//
// The ordered preimage is registered as TRUEOPEN_WORKER_TOKEN_COMMITMENT_V1
// (05-校验算法 §7.0b) and follows these field numbers exactly.
// WorkerTokenCommitmentV1 defines the WorkerTokenCommitmentV1 wire type.
message WorkerTokenCommitmentV1 {
  // Always 1. It is the A-level commitment_schema_version, independent of the
  // B-level 3: the two levels version separately because they change for
  // different reasons.
  uint32 schema_version = 1;
  string chain_id = 2;
  bytes task_id = 3 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes accepted_task_hash = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  string worker_operator_address = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes generation_params_digest = 6 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes evidence_schema_hash = 7 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes output_hash = 8 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 output_size_bytes = 9;
  uint64 output_leaf_count = 10;
  FinishReasonV1 finish_reason = 11;
  uint64 generated_token_count = 12;
  bytes input_token_ids_hash = 13 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes generated_token_ids_hash = 14 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 input_token_ids_size_bytes = 15;
  uint64 generated_token_ids_size_bytes = 16;
}

// WorkerValueCommitmentV3 is the B-level Worker commitment, behind the
// WORKER_VALUE_OPENING evidence item (ADR-0023 decision six).
//
// It replaces WorkerValueCommitmentV2, which folded the token lists, the
// trace and the checkpoint into one item alongside the values. V3 keeps only
// what B level is: a commitment to the worker_values Merkle root and the
// encoded size of the artifact behind it.
//
// The root rather than a flat hash is the point. A flat hash can only be
// checked by handing over every value, which is exactly what ADR-0023 defers;
// worker_value_root can be opened at one position, so a later joint opening
// checks a sampled position without releasing the rest.
//
// The fields A level already carries are deliberately absent: repeating
// output_hash or finish_reason here would let the two levels disagree, and the
// receipt binds both anyway.
//
// The ordered preimage is registered as TRUEOPEN_WORKER_VALUE_COMMITMENT_V3
// (05-校验算法 §7.0b).
// WorkerValueCommitmentV3 defines the WorkerValueCommitmentV3 wire type.
message WorkerValueCommitmentV3 {
  // Always 3. The jump from 2 is the split itself, not a field edit.
  uint32 schema_version = 1;
  string chain_id = 2;
  bytes task_id = 3 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes accepted_task_hash = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  string worker_operator_address = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes evidence_schema_hash = 6 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  // Root of the TRUEOPEN_PREFILL_WORKER_VALUE_ROOT_V1 tree over one leaf per
  // generated position.
  bytes worker_value_root = 7 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  // Length of the worker_values artifact, whose encoding is
  // uint32_be(leaf_count) || leaf_1 || ... || leaf_n with each leaf carrying its
  // own FRAME_V1 length prefix.
  uint64 worker_values_encoded_size_bytes = 8;
}

// WorkerEvidenceKindV1 is the closed set of objective Worker evidence.
enum WorkerEvidenceKindV1 {
  // Never written; rejects an unset evidence branch.
  // WORKER_EVIDENCE_KIND_V1_UNSPECIFIED identifies the corresponding protocol value.
  WORKER_EVIDENCE_KIND_V1_UNSPECIFIED = 0;
  // A valid signed output prefix conflicts with the accepted final MMR root.
  // WORKER_EVIDENCE_KIND_V1_OUTPUT_CHUNK_EQUIVOCATION identifies the corresponding protocol value.
  WORKER_EVIDENCE_KIND_V1_OUTPUT_CHUNK_EQUIVOCATION = 1;
}

// OutputMMRPeakProofV1 proves one prefix peak into the accepted final MMR root.
// Position and direction are derived from the receipt leaf count and seq; they
// are deliberately not caller-supplied fields.
// OutputMMRPeakProofV1 defines the OutputMMRPeakProofV1 wire type.
message OutputMMRPeakProofV1 {
  bytes peak_hash = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  repeated bytes final_inclusion_path = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
}

// OutputChunkEquivocationV1 proves that a valid Worker-signed streamed prefix
// conflicts with the final MMR root bound by an accepted InferReceiptV3.
// OutputChunkEquivocationV1 defines the OutputChunkEquivocationV1 wire type.
message OutputChunkEquivocationV1 {
  bytes task_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes accepted_infer_receipt_hash = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 seq = 3;
  bytes streamed_mmr_root = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  // Raw64 R||S low-S signature; REST uses canonical protobuf Base64.
  bytes worker_signature = 5 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
  repeated OutputMMRPeakProofV1 prefix_peak_proofs = 6 [(gogoproto.nullable) = false];
}

// WorkerEvidenceV1 is strict-decoded from MsgSubmitWorkerEvidence.evidence_bytes.
message WorkerEvidenceV1 {
  uint32 schema_version = 1;
  // Exactly one branch matching the objective evidence kind must be present.
  // evidence selects one supported variant.
  oneof evidence {
    OutputChunkEquivocationV1 output_chunk_equivocation = 2;
  }
}

// WorkerEvidenceReceiptState is the compact auditable receipt retained on chain;
// raw signatures and MMR proof nodes are never persisted here.
// WorkerEvidenceReceiptState defines the WorkerEvidenceReceiptState wire type.
message WorkerEvidenceReceiptState {
  uint32 schema_version = 1;
  bytes task_id = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  string worker_operator_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  WorkerEvidenceKindV1 evidence_kind = 4;
  uint64 seq = 5;
  bytes accepted_infer_receipt_hash = 6 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes evidence_digest = 7 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes fault_id = 8 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 accepted_height = 9;
}
