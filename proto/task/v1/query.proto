syntax = "proto3";

package task.v1;

import "google/api/annotations.proto";
import "task/v1/query_session.proto";
import "task/v1/query_settlement_build.proto";
import "task/v1/query_task.proto";

option go_package = "github.com/TrueOpen/node/x/task/types";

// Query defines Task-owned session, execution and verification queries. Every
// rpc is registered; the removed ones are
// listed at the bottom of this file.
// Query defines the Query wire type.
service Query {
  // Params returns Task parameters.
  rpc Params(QueryTaskParamsRequest) returns (QueryTaskParamsResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/params";
  }
  // Task returns the composite view of one task.
  rpc Task(QueryTaskRequest) returns (QueryTaskResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}";
  }
  // TaskStage returns the stage and next-deadline projection of one task.
  rpc TaskStage(QueryTaskStageRequest) returns (QueryTaskStageResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/stage";
  }
  // TaskAssignment returns the Worker assignment projection of one task.
  rpc TaskAssignment(QueryTaskAssignmentRequest) returns (QueryTaskAssignmentResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/assignment";
  }
  // AssignmentRandomness returns the frozen assignment randomness of one task.
  rpc AssignmentRandomness(QueryAssignmentRandomnessRequest) returns (QueryAssignmentRandomnessResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/assignment_randomness";
  }
  // TaskBudget returns the authoritative per-task accounting row.
  rpc TaskBudget(QueryTaskBudgetRequest) returns (QueryTaskBudgetResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/budget";
  }
  // TaskBuilders returns the frozen Task Builder selection of one task. It is the
  // only read path for the per-task Builder identity that Worker INPUT/OUTPUT
  // transfer, the three-Builder fan-out, the 2-of-3 data-ready confirmation and
  // the two Builder bitmaps all address; PRUNED and post-compaction semantics are
  // frozen on QueryTaskBuildersResponse.
  // TaskBuilders executes the TaskBuilders operation.
  rpc TaskBuilders(QueryTaskBuildersRequest) returns (QueryTaskBuildersResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/builders";
  }
  // InferReceipt returns one task's accepted inference receipt.
  rpc InferReceipt(QueryInferReceiptRequest) returns (QueryInferReceiptResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/infer_receipt";
  }
  // WorkerEvidence returns one compact objective-evidence receipt.
  rpc WorkerEvidence(QueryWorkerEvidenceRequest) returns (QueryWorkerEvidenceResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/worker_evidence/{worker_operator_address}/{seq}";
  }
  // VerifierValueEvidence is registered but returns ERR_NOT_ACTIVATED.
  rpc VerifierValueEvidence(QueryVerifierValueEvidenceRequest) returns (QueryVerifierValueEvidenceResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/verifier_value_evidence/{verify_round}/{target_operator_address}/{position}";
  }
  // VerifierCandidateWindow returns one round's frozen verifier window.
  rpc VerifierCandidateWindow(QueryVerifierCandidateWindowRequest) returns (QueryVerifierCandidateWindowResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/verifier_window/{verify_round}";
  }
  // VerifierAssignment returns one round's verifier assignment.
  rpc VerifierAssignment(QueryVerifierAssignmentRequest) returns (QueryVerifierAssignmentResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/verifier_assignment/{verify_round}";
  }
  // VerifyCommit returns one verifier's commit row.
  rpc VerifyCommit(QueryVerifyCommitRequest) returns (QueryVerifyCommitResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/commit/{verify_round}/{verifier_operator_address}";
  }
  // ResultReceipt returns one verifier's result credential.
  rpc ResultReceipt(QueryResultReceiptRequest) returns (QueryResultReceiptResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/result_receipt/{verify_round}/{verifier_operator_address}";
  }
  // DataUnavailableReports pages one round's verifier reports.
  rpc DataUnavailableReports(QueryDataUnavailableReportsRequest) returns (QueryDataUnavailableReportsResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/data_unavailable_reports/{verify_round}";
  }
  // BuilderDataUnavailable returns one (task, round, builder) aggregate.
  rpc BuilderDataUnavailable(QueryBuilderDataUnavailableRequest) returns (QueryBuilderDataUnavailableResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/builder_data_unavailable/{verify_round}/{builder_operator_address}";
  }
  // SettlementFacts returns the retained immutable settlement facts.
  rpc SettlementFacts(QuerySettlementFactsRequest) returns (QuerySettlementFactsResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/settlement_facts";
  }
  // Settlement returns the sole committed settlement state and plan.
  rpc Settlement(QuerySettlementRequest) returns (QuerySettlementResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/settlement";
  }
  // VerificationRound returns round 1 or round 2 state.
  rpc VerificationRound(QueryVerificationRoundRequest) returns (QueryVerificationRoundResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/verification_round/{verify_round}";
  }
  // TaskGasReimbursements pages receipts by (tx_hash, item_index).
  rpc TaskGasReimbursements(QueryTaskGasReimbursementsRequest) returns (QueryTaskGasReimbursementsResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/gas_reimbursements";
  }
  // TaskFailureClass returns one task failure classification.
  rpc TaskFailureClass(QueryTaskFailureClassRequest) returns (QueryTaskFailureClassResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/failure_class";
  }
  // EvidenceCleanup returns the bounded cleanup progress of one task.
  rpc EvidenceCleanup(QueryEvidenceCleanupRequest) returns (QueryEvidenceCleanupResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/task/{task_id}/cleanup";
  }
  // EpochTaskSummary returns the retained immutable receipt. Epoch zero is
  // invalid, an in-progress fold fails precondition, and a missing or pruned
  // receipt is not found. Partial cursor state is never returned.
  rpc EpochTaskSummary(QueryEpochTaskSummaryRequest) returns (QueryEpochTaskSummaryResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/epoch/{epoch}/task_summary";
  }
  // Session returns one stream session.
  rpc Session(QuerySessionRequest) returns (QuerySessionResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/session/{session_id}";
  }
  // SessionNonce returns the next nonce for one user.
  rpc SessionNonce(QuerySessionNonceRequest) returns (QuerySessionNonceResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/session_nonce/{user_address}";
  }
  // SessionsByOwner lists active sessions for one user.
  rpc SessionsByOwner(QuerySessionsByOwnerRequest) returns (QuerySessionsByOwnerResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/sessions/{user_address}";
  }
  // SessionTerminalSummary returns one collapsed session summary.
  rpc SessionTerminalSummary(QuerySessionTerminalSummaryRequest) returns (QuerySessionTerminalSummaryResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/session/{session_id}/terminal_summary";
  }
  // OrderSequence returns one order sequence audit row.
  rpc OrderSequence(QueryOrderSequenceRequest) returns (QueryOrderSequenceResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/session/{session_id}/order/{order_sequence}";
  }
  // RoleActiveTasks lists active tasks for one worker or verifier.
  rpc RoleActiveTasks(QueryRoleActiveTasksRequest) returns (QueryRoleActiveTasksResponse) {
    option (google.api.http).get = "/TrueOpen/task/v1/role/{operator_address}/{duty}/active_tasks";
  }
}

// Fresh Phase 0 has no settlement preview, challenge-id, proof, opening, or
// full-result-reveal Query surface.
//   QueryTimeoutBucket
//     - moved to hub.v1.Query with the single governance bucket writer.
// Hub and Task Params remain separate module queries; Phase 0 intentionally has
// no app-level combined Params RPC.
