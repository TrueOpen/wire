syntax = "proto3";
package task.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "shared/v1/common.proto";
import "task/v1/params.proto";
import "shared/v1/rest_encoding.proto";

option go_package = "github.com/TrueOpen/node/x/task/types";

// MsgUpdateTaskParams updates the Task module parameters.
// The expected-version compare and grouped TaskParamsV1 body are frozen by
// the wire API. The response returns the newly committed version and hash.
// MsgUpdateTaskParams defines the MsgUpdateTaskParams wire type.
message MsgUpdateTaskParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "trueopen/x/task/MsgUpdateTaskParams";

  uint64 expected_version = 1;
  TaskParamsV1 params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string authority = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgUpdateTaskParamsResponse defines the response structure for executing a
// MsgUpdateTaskParams message.
// MsgUpdateTaskParamsResponse defines the MsgUpdateTaskParamsResponse wire type.
message MsgUpdateTaskParamsResponse {
  uint64 new_version = 1;
  bytes params_hash = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  shared.v1.MutationStatusV1 status = 3;
}

// MsgCreateSession opens one session namespace and locks its owner
// (the wire API). Besides the required Cosmos signer there is no business
// input: the nonce comes from SessionNonceState and session_id is derived on
// chain by TRUEOPEN_SESSION_V1. Model A: creating a session never moves funds, and
// no unbounded metadata is accepted.
// MsgCreateSession defines the MsgCreateSession wire type.
message MsgCreateSession {
  option (cosmos.msg.v1.signer) = "signer_address";
  option (amino.name) = "trueopen/x/task/MsgCreateSession";

  string signer_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgCreateSessionResponse returns the chain-derived session identity
//. Clients may also recompute session_id off chain from the same
// formula; the owner is not derivable from session_id, hence StreamState still
// stores it.
// MsgCreateSessionResponse defines the MsgCreateSessionResponse wire type.
message MsgCreateSessionResponse {
  bytes session_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 session_nonce = 2;
  shared.v1.MutationStatusV1 status = 3;
}

// MsgCancelOrder skips the next unconsumed order sequence so an off-chain order
// stops occupying it. signer_address is the Cosmos signer and
// must equal the stream owner; no duplicate detached owner signature is required.
// It may only cancel next_expected_sequence, never a sequence already accepted by
// MsgSubmitWorkerHandraises, and it moves no funds.
// MsgCancelOrder defines the MsgCancelOrder wire type.
message MsgCancelOrder {
  option (cosmos.msg.v1.signer) = "signer_address";
  option (amino.name) = "trueopen/x/task/MsgCancelOrder";

  bytes session_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 order_sequence = 2;
  string signer_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgCancelOrderResponse reports the cancelled sequence and the advanced counter
//. task_id stays empty because a cancelled sequence never created a task.
// MsgCancelOrderResponse defines the MsgCancelOrderResponse wire type.
message MsgCancelOrderResponse {
  bytes task_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 cancelled_sequence = 2;
  uint64 next_expected_sequence = 3;
  shared.v1.MutationStatusV1 status = 4;
}

// REMOVED: MsgUpdateTimeoutBucket / MsgUpdateTimeoutBucketResponse. They lived in
// this file but belong to the bucket domain, and their response referenced
// TimeoutBucketState, which the bucket owner has already deleted. the wire API
// freezes the replacement as
// `MsgUpdateTimeoutBucket{1=update:TimeoutBucketUpdateV1,2=authority:Address}`;
// it must be re-registered by the owner of the timeout bucket wire, not
// here. The governed ReferenceBucket path is gone entirely, so
// the replacement takes no shape from it.
