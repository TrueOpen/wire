syntax = "proto3";

package task.v1;

import "cosmos_proto/cosmos.proto";
import "shared/v1/common.proto";
import "shared/v1/rest_encoding.proto";
import "task/v1/evidence.proto";

option go_package = "github.com/TrueOpen/node/x/task/types";

// WorkerValueCommitmentOpeningV1 opens only the two unavailable commitment
// fields. Chain, task, Worker and evidence schema come from accepted authority.
message WorkerValueCommitmentOpeningV1 {
  bytes worker_value_root = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 worker_values_encoded_size_bytes = 2;
}

// VerifierValuePositionOpeningV1 contains bounded canonical leaves and their
// membership paths. A WORKER_VALUES_INVALID proof leaves Verifier/metric data empty.
message VerifierValuePositionOpeningV1 {
  uint64 position = 1;
  bytes worker_value_leaf = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
  repeated bytes worker_value_path = 3 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes verifier_value_leaf = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
  repeated bytes verifier_value_path = 5 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes metric_leaf = 6 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
  repeated bytes metric_path = 7 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
}

// VerifierValueEvidenceV1 is exact strict-decoded material, never a persisted
// opening state. Positions must be strictly increasing and unique, within the
// accepted receipt's token count and the per-target cumulative parameter cap.
message VerifierValueEvidenceV1 {
  uint32 schema_version = 1;
  bytes task_id = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint32 verify_round = 3;
  string target_operator_address = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  VerifierValueEvidenceKindV1 evidence_kind = 5;
  WorkerValueCommitmentOpeningV1 worker_value_commitment_opening = 6;
  repeated VerifierValuePositionOpeningV1 positions = 7;
}

// VerifierValueEvidenceReceiptState retains accepted identity only. Its primary
// key is (task_id, verify_round, target_operator_address, position); all positions
// for the same target/round reuse the first fault_id. Cleanup follows Task evidence.
message VerifierValueEvidenceReceiptState {
  uint32 schema_version = 1;
  bytes task_id = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint32 verify_round = 3;
  string target_operator_address = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 position = 5;
  VerifierValueEvidenceKindV1 evidence_kind = 6;
  shared.v1.Duty faulted_duty = 7;
  bytes evidence_digest = 8 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes fault_id = 9 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 accepted_height = 10;
}

// EventVerifierValueEvidenceAccepted is event 30. Invalid proof and exact replay
// emit nothing. Local contradictions record role fault without changing verdict.
message EventVerifierValueEvidenceAccepted {
  bytes task_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint32 verify_round = 2;
  string target_operator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  shared.v1.Duty faulted_duty = 4;
  VerifierValueEvidenceKindV1 evidence_kind = 5;
  bytes evidence_digest = 6 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes fault_id = 7 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint32 position_count = 8;
  uint64 accepted_height = 9;
}
