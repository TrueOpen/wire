syntax = "proto3";
package task.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "shared/v1/amount.proto";
import "shared/v1/common.proto";
import "shared/v1/model_profile.proto";
import "task/v1/assignment.proto";
import "task/v1/open_verify.proto";
import "shared/v1/rest_encoding.proto";

option go_package = "github.com/TrueOpen/node/x/task/types";

// DeadlineLatencyClass is the only latency class set. Values are frozen by
// the API contract because they enter the user-signed task_hash through
// TaskOrderV3.deadline_policy (§5.13 field 20).
// DeadlineLatencyClass defines the DeadlineLatencyClass wire type.
enum DeadlineLatencyClass {
  // Never accepted in a signed order.
  // DEADLINE_LATENCY_CLASS_UNSPECIFIED identifies the corresponding protocol value.
  DEADLINE_LATENCY_CLASS_UNSPECIFIED = 0;
  // Cheapest, longest timeout combination.
  // DEADLINE_LATENCY_CLASS_ECONOMY identifies the corresponding protocol value.
  DEADLINE_LATENCY_CLASS_ECONOMY = 1;
  // Default timeout combination.
  // DEADLINE_LATENCY_CLASS_STANDARD identifies the corresponding protocol value.
  DEADLINE_LATENCY_CLASS_STANDARD = 2;
  // Shortened timeout combination.
  // DEADLINE_LATENCY_CLASS_FAST identifies the corresponding protocol value.
  DEADLINE_LATENCY_CLASS_FAST = 3;
  // Shortest timeout combination.
  // DEADLINE_LATENCY_CLASS_EXPRESS identifies the corresponding protocol value.
  DEADLINE_LATENCY_CLASS_EXPRESS = 4;
}

// DeadlinePolicyV1 carries only the protocol-allowed latency class (§5.13).
// Keeper recomputes the concrete timeout blocks from timeout_bucket_version and
// rejects out-of-range combinations; callers never submit absolute deadlines.
// DeadlinePolicyV1 defines the DeadlinePolicyV1 wire type.
message DeadlinePolicyV1 {
  DeadlineLatencyClass latency_class = 1;
}

// DecodingParamsV1 is the frozen decoding parameter set of api_contract §5.6. SDKs
// fill defaults explicitly before signing; stop_sequences ascend by UTF-8 bytes
// and stop_token_ids ascend numerically. Unknown fields, floats and out-of-range
// values are rejected.
// DecodingParamsV1 defines the DecodingParamsV1 wire type.
message DecodingParamsV1 {
  bool sampling_enabled = 1;
  uint32 temperature_milli = 2;
  uint32 top_p_ppm = 3;
  // 0 disables top-k.
  uint32 top_k = 4;
  uint64 seed = 5;
  int32 presence_penalty_milli = 6;
  int32 frequency_penalty_milli = 7;
  uint32 repetition_penalty_ppm = 8;
  repeated string stop_sequences = 9;
  repeated uint32 stop_token_ids = 10;
}

// GenerationParamsV1 is the typed order-side generation parameter set (§5.6).
// generation_params_digest is derived by Keeper from the canonical JSON
// projection (TRUEOPEN_TASK_GENERATION_PARAMS_V1); callers must not submit it.
// GenerationParamsV1 defines the GenerationParamsV1 wire type.
message GenerationParamsV1 {
  uint32 generation_params_schema_version = 1;
  uint64 max_output_tokens = 2;
  // Milliseconds.
  uint64 max_output_duration = 3;
  DecodingParamsV1 decoding_params = 4 [(gogoproto.nullable) = false];
}

// TaskOrderV3 is the user-authored order (api_contract §5.13). The user signs the
// order-domain EIP-712 digest whose taskHash commits
// H_FIELDS_V1("TRUEOPEN_TASK_ORDER_V3", canonical TaskOrderV3). Keeper
// derives task_id, task_hash, generation_params_digest, order_value,
// task_builder_seed, reward bucket, resource tier and the Task Builders; none of
// them may be submitted here.
// TaskOrderV3 defines the TaskOrderV3 wire type.
message TaskOrderV3 {
  // Always 2; V1 orders are not accepted by the fresh v0.3.0 schema.
  uint32 schema_version = 1;
  string chain_id = 2;
  string user_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes session_id = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 order_sequence = 5;
  string model_id = 6;
  uint32 profile_version = 7;
  shared.v1.TaskType task_type = 8;
  bytes input_hash = 9 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint64 input_size_bytes = 10;
  uint32 input_bucket = 11;
  uint32 output_budget_bucket = 12;
  GenerationParamsV1 generation_params = 13 [(gogoproto.nullable) = false];
  shared.v1.Amount price_bid = 14 [(gogoproto.nullable) = false];
  shared.v1.Amount max_fee = 15 [(gogoproto.nullable) = false];
  shared.v1.Amount assignment_priority_fee = 16 [(gogoproto.nullable) = false];
  shared.v1.Amount tx_fee_reserve = 17 [(gogoproto.nullable) = false];
  uint64 earliest_submit_height = 18;
  uint64 order_expire_height = 19;
  DeadlinePolicyV1 deadline_policy = 20 [(gogoproto.nullable) = false];
  uint64 timeout_bucket_version = 21;
  uint64 session_anchor_height = 22;
  bytes session_anchor_block_hash = 23 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  string builder_set_id = 24;
  bytes builder_set_hash = 25 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  // Fields 26-28 are ADR-0024 reserved slots. They enter task_hash and are
  // therefore covered by the user's order signature; they do NOT enter the
  // order opening projection.
  //
  // Being in task_hash is the reason they exist now rather than later. The
  // order is what the user signs, and task_hash is derived from it; adding a
  // field to that derivation after genesis would change the identity of every
  // task. Signing over PLAINTEXT and two empty values costs three frames.
  //
  // With encryption_activation_height at 0, PLAINTEXT is the only accepted
  // mode and the other two must be empty. An order that sets ENCRYPTED, or
  // leaves PLAINTEXT but fills either commitment, is refused at admission and
  // nothing is persisted -- the Builder does not even store the input. Refused
  // rather than ignored, because an accepted order carrying a key commitment
  // no one will open looks to a reader like encryption is in effect.
  PayloadModeV1 payload_mode = 26;
  bytes input_key_commitment = 27 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  // Uncompressed secp256k1 point, 65 bytes, when ADR-0024 activates.
  bytes user_recipient_pubkey = 28 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
}

// PayloadModeV1 says whether the data plane for a task is plaintext or
// ADR-0024 encrypted. It is declared in the order and enters task_hash, so the
// mode a task runs under is fixed by what the user signed rather than by a
// runtime decision.
//
// Phase 0 accepts PLAINTEXT only: encryption_activation_height is 0 and every
// locked profile has require_encrypted false.
enum PayloadModeV1 {
  // Never accepted. An order must state its mode; defaulting to plaintext
  // would let an unset field mean "unencrypted" and make the distinction
  // invisible in exactly the case where it matters.
  // PAYLOAD_MODE_V1_UNSPECIFIED identifies the corresponding protocol value.
  PAYLOAD_MODE_V1_UNSPECIFIED = 0;
  // The data plane carries plaintext. The only mode accepted in Phase 0.
  // PAYLOAD_MODE_V1_PLAINTEXT identifies the corresponding protocol value.
  PAYLOAD_MODE_V1_PLAINTEXT = 1;
  // ADR-0024 producer-managed payload encryption. Registered so the enum does
  // not have to grow later; refused until encryption_activation_height is set.
  // PAYLOAD_MODE_V1_ENCRYPTED identifies the corresponding protocol value.
  PAYLOAD_MODE_V1_ENCRYPTED = 2;
}

// SignedOrderV2 is the upstream-locked signed order envelope (§5.13).
// signature_scheme accepts exactly lowercase "eip712" and is not persisted on
// Task state. user_signature is recoverable 65-byte R||S||V with V in {27,28}
// and low-S.
// SignedOrderV2 defines the SignedOrderV2 wire type.
message SignedOrderV2 {
  TaskOrderV3 order = 1 [(gogoproto.nullable) = false];
  string signature_scheme = 2;
  bytes user_signature = 3 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
}

// ExistingTaskRefV1 addresses an already accepted task for a follow-up proposal
// (api_contract §4.2.1). task_hash is an immutable conflict guard and must equal the
// authoritative task value.
// ExistingTaskRefV1 defines the ExistingTaskRefV1 wire type.
message ExistingTaskRefV1 {
  bytes task_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes task_hash = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
}

// WorkerHandraiseScopeV1 is the exactly-one proposal scope of §4.2.1. The first
// proposal must carry signed_order; any later proposal must carry existing_task.
// Both filled or both empty is rejected.
// WorkerHandraiseScopeV1 defines the WorkerHandraiseScopeV1 wire type.
message WorkerHandraiseScopeV1 {
  // Exactly one branch must be present.
  // scope selects one supported variant.
  oneof scope {
    SignedOrderV2 signed_order = 1;
    ExistingTaskRefV1 existing_task = 2;
  }
}

// WorkerHandraiseV1 is one Cortex-signed Worker handraise (api_contract §4.1). Its
// `member` field uses the single module-wide CandidateMemberRefV1, declared in
// task/v1/open_verify.proto. The
// signing digest is H_FIELDS_V1("TRUEOPEN_WORKER_HANDRAISE_V1", all fields except
// service_signature) in exactly this field order. service_authorization_nonce
// must equal the operator's current service binding nonce; it is not a
// per-message counter. Raw handraises are never persisted.
//
// schema_version is 1: §4.1 writes `schema_version: uint32 = 1` literally for this
// wire. InferReceiptV3 is the only sibling receipt that uses schema version 3.
// WorkerHandraiseV1 defines the WorkerHandraiseV1 wire type.
message WorkerHandraiseV1 {
  // Always 1; §4.1 pins it literally.
  uint32 schema_version = 1;
  string chain_id = 2;
  bytes task_id = 3 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes task_hash = 4 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  string model_id = 5;
  uint32 profile_version = 6;
  CandidateMemberRefV1 member = 7 [(gogoproto.nullable) = false];
  shared.v1.Duty duty = 8;
  uint64 service_authorization_nonce = 9;
  uint64 expiry_height = 10;
  bytes service_signature = 11 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
  // ADR-0024 reserved: where a candidate would publish the key material a
  // producer encrypts to. It sits after service_signature by field number but
  // inside the handraise preimage, so a candidate cannot offer a recipient key
  // the signature does not cover. Empty in Phase 0; a non-empty value is
  // refused at handraise admission.
  bytes recipient_pubkey = 12 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_PROTOJSON_BASE64];
}

// MsgSubmitWorkerHandraises accepts the order plus Worker handraises and ORs the
// legal bits into the authoritative stage union (api_contract §4.2.1 / §10.1).
// submitter_address is the Cosmos signer only: it pays gas, never enters the
// proposal digest or any frozen candidate fact. Builder operator, BuilderSet,
// Task Builders, pool hash, candidate weights, legal-set hash and deadlines are
// all Keeper-derived and must not appear as request copies.
// MsgSubmitWorkerHandraises defines the MsgSubmitWorkerHandraises wire type.
message MsgSubmitWorkerHandraises {
  option (cosmos.msg.v1.signer) = "submitter_address";
  option (amino.name) = "trueopen/x/task/MsgSubmitWorkerHandraises";

  WorkerHandraiseScopeV1 scope = 1 [(gogoproto.nullable) = false];
  repeated WorkerHandraiseV1 handraises = 2 [(gogoproto.nullable) = false];
  string submitter_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgSubmitWorkerHandraisesResponse reports the Keeper-derived proposal receipt
// (§4.2.1). added_member_count is the number of 0->1 bits in this proposal and is
// 0 for an exact replay noop; union_count is the committed authoritative count.
// MsgSubmitWorkerHandraisesResponse defines the MsgSubmitWorkerHandraisesResponse wire type.
message MsgSubmitWorkerHandraisesResponse {
  bytes task_id = 1 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  bytes proposal_digest = 2 [(shared.v1.rest_bytes_encoding) = REST_BYTES_ENCODING_HASH32_LOWER_HEX];
  uint32 added_member_count = 3;
  uint32 union_count = 4;
  TaskCandidateStageStatusV1 stage_status = 5;
}
