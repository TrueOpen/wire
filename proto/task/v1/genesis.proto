syntax = "proto3";
package task.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "task/v1/assignment.proto";
import "task/v1/challenge.proto";
import "task/v1/cleanup.proto";
import "task/v1/commit.proto";
import "task/v1/epoch_summary.proto";
import "task/v1/evidence.proto";
import "task/v1/infer_receipt.proto";
import "task/v1/open_verify.proto";
import "task/v1/params.proto";
import "task/v1/result.proto";
import "task/v1/session.proto";
import "task/v1/settlement.proto";
import "task/v1/timeout_bucket.proto";

option go_package = "github.com/TrueOpen/node/x/task/types";

// GenesisState contains every Task primary/cursor needed for an exact
// export/import round trip. Derived indexes are rebuilt and cross-checked.
// GenesisState defines the GenesisState wire type.
message GenesisState {
  TaskParamsV1 params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  TaskParamsMetaState params_meta = 2 [(gogoproto.nullable) = false];

  repeated SessionNonceState session_nonces = 10 [(gogoproto.nullable) = false];
  repeated StreamState streams = 11 [(gogoproto.nullable) = false];
  repeated OrderSequenceState order_sequences = 12 [(gogoproto.nullable) = false];
  repeated TaskBudgetState task_budgets = 14 [(gogoproto.nullable) = false];
  repeated SessionHistoryPruneCursorState session_history_prune_cursors = 15 [(gogoproto.nullable) = false];
  repeated SessionTerminalSummaryState session_terminal_summaries = 16 [(gogoproto.nullable) = false];

  // TaskCoreState is the only primary of the six Task sub-states.
  repeated TaskCoreState task_cores = 19 [(gogoproto.nullable) = false];
  repeated TaskAssignmentState task_assignments = 21 [(gogoproto.nullable) = false];
  repeated AssignmentCandidateSetState assignment_candidate_sets = 22 [(gogoproto.nullable) = false];
  repeated InferReceiptState infer_receipts = 24 [(gogoproto.nullable) = false];
  repeated VerifierAssignmentState verifier_assignments = 26 [(gogoproto.nullable) = false];
  repeated CommitState commits = 27 [(gogoproto.nullable) = false];
  repeated ResultReceiptState result_receipts = 28 [(gogoproto.nullable) = false];

  // Handraise / candidate freeze rows (§4.2/§4.6).
  repeated TaskCandidateFactState task_candidate_facts = 32 [(gogoproto.nullable) = false];
  repeated BuilderStageProposalState builder_stage_proposals = 33 [(gogoproto.nullable) = false];
  repeated TaskStageHandraiseUnionState task_stage_handraise_unions = 34 [(gogoproto.nullable) = false];
  repeated TaskStageHandraiseUnionSegmentState task_stage_handraise_union_segments = 35 [(gogoproto.nullable) = false];
  repeated TaskCandidateFinalizeCursorState task_candidate_finalize_cursors = 36 [(gogoproto.nullable) = false];
  repeated TaskBuilderSelectionState task_builder_selections = 37 [(gogoproto.nullable) = false];

  // Verifier window and verification rows (§4.4/§6.6).
  repeated VerifierCandidateWindowState verifier_candidate_windows = 38 [(gogoproto.nullable) = false];
  repeated VerifierCandidateEligibilitySegmentState verifier_candidate_eligibility_segments = 39 [(gogoproto.nullable) = false];
  repeated VerifierCandidateWindowMemberState verifier_candidate_window_members = 46 [(gogoproto.nullable) = false];
  repeated DataUnavailableReportState data_unavailable_reports = 48 [(gogoproto.nullable) = false];
  repeated BuilderDataUnavailableAggregateState builder_data_unavailable_aggregates = 49 [(gogoproto.nullable) = false];

  repeated TaskFailureClassState task_failure_classes = 42 [(gogoproto.nullable) = false];

  // Governance parameter bucket references; task_ref_count is recomputed in
  // x/hub from these rows and a mismatch is rejected (§6.7).
  repeated TaskBucketRefState task_bucket_refs = 59 [(gogoproto.nullable) = false];
  repeated TaskCleanupCursorState task_cleanup_cursors = 60 [(gogoproto.nullable) = false];
  repeated TaskTerminalSummaryState task_terminal_summaries = 61 [(gogoproto.nullable) = false];
  repeated EpochTaskSummaryCursorState epoch_task_summary_cursors = 62 [(gogoproto.nullable) = false];
  repeated EpochTaskSummaryReceiptState epoch_task_summary_receipts = 63 [(gogoproto.nullable) = false];
  repeated TaskGasReimbursementV1 task_gas_reimbursements = 64 [(gogoproto.nullable) = false];
  repeated VerificationRoundState verification_rounds = 65 [(gogoproto.nullable) = false];
  repeated RoundFundingState round_fundings = 66 [(gogoproto.nullable) = false];
  repeated RoundEconomicEffectState round_economic_effects = 67 [(gogoproto.nullable) = false];
  repeated RoundEconomicEffectApplyCursorState round_economic_effect_apply_cursors = 68 [(gogoproto.nullable) = false];
  repeated TaskRoundSummaryState task_round_summaries = 69 [(gogoproto.nullable) = false];
  repeated VerifierPayoutState verifier_payouts = 70 [(gogoproto.nullable) = false];
  repeated TaskSettlementState task_settlements = 71 [(gogoproto.nullable) = false];
  repeated SettlementFactsRetainedState settlement_facts_retained = 72 [(gogoproto.nullable) = false];
  repeated WorkerEvidenceReceiptState worker_evidence_receipts = 73 [(gogoproto.nullable) = false];
}
